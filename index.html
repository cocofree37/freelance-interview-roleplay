<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>案件面談 想定質問チェック</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  textarea { width: 100%; box-sizing: border-box; font-family: inherit; padding: 8px; }
  button { font-weight: 500; padding: 10px 16px; border-radius: 8px; border: 1px solid #888; background: white; cursor: pointer; margin-top: 12px; }
  .error { font-size: 13px; color: #c0392b; display: none; margin-top: 6px; }
  #output { display: none; margin-top: 2rem; border-top: 1px solid #ddd; padding-top: 1.5rem; }
  .category { border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .category h3 { margin: 0 0 8px; font-size: 16px; }
  .category h4 { font-size: 13px; color: #555; margin: 10px 0 4px; }
  .category ul { margin: 0; padding-left: 1.2rem; font-size: 14px; }
  .category ul.tips li { color: #2c6e2f; }
</style>
</head>
<body>
<h2>案件面談 想定質問チェック</h2>
<p style="font-size:14px;color:#555;">案件の募集要項をコピペするだけで、面談で聞かれそうな質問と準備しておくとよいことをまとめます。</p>

<label style="font-weight:500;display:block;margin-bottom:6px;">案件内容 / URL</label>
<textarea id="job-content" rows="6" placeholder="募集要項をコピペ、または案件URLを貼り付け"></textarea>
<div id="form-error" class="error"></div>

<button id="submit-btn">想定される質問を出力</button>

<div id="output"></div>

<script>
function el(tag, props, children) {
  var node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function(k) {
      if (k === 'class') node.className = props[k];
      else node.setAttribute(k, props[k]);
    });
  }
  (children || []).forEach(function(c) {
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else if (c) node.appendChild(c);
  });
  return node;
}

function excerpt(text) {
  var s = text.replace(/\s+/g, ' ').trim();
  return s.length > 40 ? s.slice(0, 40) + '…' : s;
}

function buildCategories(jobContent) {
  return [
    {
      key: 'icebreak',
      title: 'アイスブレイク・自己紹介',
      questions: ['簡単に自己紹介をお願いします', 'これまでの経歴を教えてください', '今回応募した理由を教えてください'],
      tips: ['30秒程度で話せる自己紹介(経歴・得意分野・実績)を用意しておく']
    },
    {
      key: 'requirements',
      title: '案件要件のすり合わせ',
      questions: ['今回の「' + excerpt(jobContent) + '」という案件ですが、対応可能そうですか?', '案件の背景や目的について理解されていますか?', '類似案件の経験はありますか?'],
      tips: ['募集要項を読み込み、対応可否をすぐ答えられるようにしておく', '不明点があれば事前に質問リストを用意しておく']
    },
    {
      key: 'achievements',
      title: '実績・スキルの深掘り',
      questions: ['その実績で具体的にどんな役割を担いましたか?', '成果を数字で教えてください', '一番苦労した点と、どう乗り越えたかを教えてください'],
      tips: ['直近の実績を2〜3件、役割と成果をセットで話せるように整理しておく']
    },
    {
      key: 'workConditions',
      title: '稼働条件',
      questions: ['稼働できる曜日・時間帯を教えてください', '繁忙期や急な依頼にはどこまで対応できますか?', '連絡ツールやレスポンス速度への希望はありますか?'],
      tips: ['稼働可能な曜日・時間・上限時間数を数字で言えるようにしておく', '繁忙期対応の可否ラインを決めておく']
    },
    {
      key: 'pricing',
      title: '単価・契約条件',
      questions: ['希望単価を教えてください', 'その金額の根拠(相場観)を教えてください', '業務範囲外の依頼が発生した場合はどう対応しますか?'],
      tips: ['希望単価と譲歩できる下限ラインを事前に決めておく', '類似案件の相場を調べておく']
    },
    {
      key: 'risk',
      title: 'リスク耐性・トラブル対応',
      questions: ['途中で仕様変更が入ったらどう対応しますか?', '他の案件と重なった場合はどうしますか?', '納期に間に合わなそうな場合、どう連絡しますか?'],
      tips: ['トラブル時の報告・連絡・相談の方針を一言で言えるようにしておく']
    },
    {
      key: 'closing',
      title: 'クロージング・逆質問',
      questions: ['何か質問はありますか?'],
      tips: ['逆質問を2〜3個用意しておく(業務の進め方、チーム体制、評価基準など)']
    }
  ];
}

var KEYWORD_QUESTIONS = [
  { pattern: /リモート|在宅/, key: 'workConditions', question: '完全リモートでの稼働ですが、コミュニケーション面で工夫していることはありますか?' },
  { pattern: /常駐|出社/, key: 'workConditions', question: '出社頻度や勤務地について、対応可能な範囲を教えてください' },
  { pattern: /週\d|曜日/, key: 'workConditions', question: '募集要項にある稼働日数・曜日に対応できますか?' },
  { pattern: /単価|報酬|時給|月額|円/, key: 'pricing', question: '募集要項に記載の金額感について、希望とのすり合わせをさせてください' },
  { pattern: /急募|即日|すぐ/, key: 'workConditions', question: '開始時期はいつから対応可能ですか?' },
  { pattern: /長期|継続/, key: 'requirements', question: '長期的な参画を想定していますが、継続的に稼働できそうですか?' }
];

document.getElementById('submit-btn').addEventListener('click', function() {
  var jobContent = document.getElementById('job-content').value.trim();
  var errorEl = document.getElementById('form-error');

  if (!jobContent) {
    errorEl.textContent = '案件内容またはURLを入力してください';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  var categories = buildCategories(jobContent);
  var byKey = {};
  categories.forEach(function(c) { byKey[c.key] = c; });

  KEYWORD_QUESTIONS.forEach(function(kq) {
    if (kq.pattern.test(jobContent) && byKey[kq.key].questions.indexOf(kq.question) === -1) {
      byKey[kq.key].questions.push(kq.question);
    }
  });

  var output = document.getElementById('output');
  output.innerHTML = '';

  categories.forEach(function(c) {
    var qList = el('ul', {}, c.questions.map(function(q) { return el('li', {}, [q]); }));
    var tipList = el('ul', { class: 'tips' }, c.tips.map(function(t) { return el('li', {}, [t]); }));

    var card = el('div', { class: 'category' }, [
      el('h3', {}, [c.title]),
      el('h4', {}, ['想定される質問']),
      qList,
      el('h4', {}, ['準備しておくとよいこと']),
      tipList
    ]);
    output.appendChild(card);
  });

  output.style.display = 'block';
  output.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
</body>
</html>
