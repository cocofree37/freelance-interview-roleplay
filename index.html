<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>案件面談 準備アシスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg: #f7f6f3;
    --ink: #1c1b19;
    --ink-soft: #6f6d68;
    --line: #ddd9d1;
    --line-soft: #eae7e0;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 6rem 1.5rem 8rem;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 0 1.25rem;
  }

  h1 {
    font-family: 'Zen Old Mincho', serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    margin: 0 0 1.25rem;
  }

  .lead {
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-soft);
    margin: 0 0 4rem;
    max-width: 46ch;
  }

  .field-label {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 0.9rem;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 15px;
    font-weight: 300;
    color: var(--ink);
    background: var(--paper);
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 0 0 1rem;
    resize: vertical;
    line-height: 1.8;
  }

  textarea:focus {
    outline: none;
    border-bottom-color: var(--ink);
  }

  textarea::placeholder { color: #b3b0a8; }

  .error {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #a44a3f;
    display: none;
    margin-top: 0.75rem;
  }

  button {
    margin-top: 2.5rem;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.18em;
    font-weight: 400;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 1rem 2.4rem;
    cursor: pointer;
    transition: opacity 0.25s ease;
  }

  button:hover { opacity: 0.78; }
  button:disabled { opacity: 0.4; cursor: default; }

  .status {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 1rem;
    display: none;
  }

  #output {
    display: none;
    margin-top: 6rem;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #output.show { opacity: 1; }

  .source-note {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-bottom: 3rem;
  }

  .category {
    padding: 2.5rem 0;
    border-top: 1px solid var(--line-soft);
  }

  .category:first-of-type { border-top: 1px solid var(--line); }

  .category .index {
    font-family: 'Zen Old Mincho', serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 0.6rem;
  }

  .category h3 {
    font-family: 'Zen Old Mincho', serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.02em;
    margin: 0 0 1.5rem;
  }

  .category h4 {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 1.5rem 0 0.8rem;
  }

  .category ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .category ul li {
    font-size: 15px;
    line-height: 1.9;
    padding-left: 1.3rem;
    position: relative;
  }

  .category ul li + li { margin-top: 0.5rem; }

  .category ul.questions li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.85em;
    width: 5px;
    height: 1px;
    background: var(--ink);
  }

  .category ul.tips li { color: var(--ink-soft); font-size: 14px; }

  .category ul.tips li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.8em;
    width: 5px;
    height: 1px;
    background: var(--ink-soft);
  }

  .section-title {
    font-family: 'Zen Old Mincho', serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 2rem;
  }

  .section + .section {
    margin-top: 5rem;
    padding-top: 5rem;
    border-top: 1px solid var(--line);
  }

  .proposal-text {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 2;
    background: var(--paper);
    padding: 2rem;
    border: 1px solid var(--line-soft);
  }

  .copy-btn {
    margin-top: 1.25rem;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.6rem 1.4rem;
  }

  .copy-btn:hover { opacity: 1; background: var(--line-soft); }

  @media (max-width: 480px) {
    .wrap { padding: 4rem 1.25rem 6rem; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Interview Preparation</p>
  <h1>案件面談<br />準備アシスト</h1>
  <p class="lead">募集要項を貼り付けてください。①面談で聞かれそうな質問と準備事項、②案件に対する提案文の下書きをまとめて作成します。</p>

  <label class="field-label">案件内容 / URL</label>
  <textarea id="job-content" rows="7" placeholder="募集要項をコピペ、または案件URLを貼り付け"></textarea>
  <div id="form-error" class="error"></div>

  <label class="field-label" style="margin-top: 2.5rem;">あなたの実績・経歴(提案文の作成に使用・任意)</label>
  <textarea id="profile" rows="6" placeholder="職務経歴書の内容や、これまでの実績・得意分野を貼り付け(未入力でも作成できますが、具体的な提案文にするために入力を推奨します)"></textarea>

  <button id="submit-btn">出力する</button>
  <p id="status" class="status"></p>

  <div id="output"></div>
</div>

<script>
var WORKER_URL = '';

function el(tag, props, children) {
  var node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function(k) {
      if (k === 'class') node.className = props[k];
      else node.setAttribute(k, props[k]);
    });
  }
  (children || []).forEach(function(c) {
    if (typeof c === 'string') node.appendChild(document.createTextNode(c));
    else if (c) node.appendChild(c);
  });
  return node;
}

function excerpt(text) {
  var s = text.replace(/\s+/g, ' ').trim();
  return s.length > 40 ? s.slice(0, 40) + '…' : s;
}

function buildHeuristicCategories(jobContent) {
  return [
    {
      title: 'アイスブレイク・自己紹介',
      questions: ['簡単に自己紹介をお願いします', 'これまでの経歴を教えてください', '今回応募した理由を教えてください'],
      tips: ['30秒程度で話せる自己紹介(経歴・得意分野・実績)を用意しておく']
    },
    {
      title: '案件要件のすり合わせ',
      questions: ['今回の「' + excerpt(jobContent) + '」という案件ですが、対応可能そうですか?', '案件の背景や目的について理解されていますか?', '類似案件の経験はありますか?'],
      tips: ['募集要項を読み込み、対応可否をすぐ答えられるようにしておく', '不明点があれば事前に質問リストを用意しておく']
    },
    {
      title: '実績・スキルの深掘り',
      questions: ['その実績で具体的にどんな役割を担いましたか?', '成果を数字で教えてください', '一番苦労した点と、どう乗り越えたかを教えてください'],
      tips: ['直近の実績を2〜3件、役割と成果をセットで話せるように整理しておく']
    },
    {
      title: '稼働条件',
      questions: ['稼働できる曜日・時間帯を教えてください', '繁忙期や急な依頼にはどこまで対応できますか?', '連絡ツールやレスポンス速度への希望はありますか?'],
      tips: ['稼働可能な曜日・時間・上限時間数を数字で言えるようにしておく', '繁忙期対応の可否ラインを決めておく']
    },
    {
      title: '単価・契約条件',
      questions: ['希望単価を教えてください', 'その金額の根拠(相場観)を教えてください', '業務範囲外の依頼が発生した場合はどう対応しますか?'],
      tips: ['希望単価と譲歩できる下限ラインを事前に決めておく', '類似案件の相場を調べておく']
    },
    {
      title: 'リスク耐性・トラブル対応',
      questions: ['途中で仕様変更が入ったらどう対応しますか?', '他の案件と重なった場合はどうしますか?', '納期に間に合わなそうな場合、どう連絡しますか?'],
      tips: ['トラブル時の報告・連絡・相談の方針を一言で言えるようにしておく']
    },
    {
      title: 'クロージング・逆質問',
      questions: ['何か質問はありますか?'],
      tips: ['逆質問を2〜3個用意しておく(業務の進め方、チーム体制、評価基準など)']
    }
  ];
}

var KEYWORD_QUESTIONS = [
  { pattern: /リモート|在宅/, index: 3, question: '完全リモートでの稼働ですが、コミュニケーション面で工夫していることはありますか?' },
  { pattern: /常駐|出社/, index: 3, question: '出社頻度や勤務地について、対応可能な範囲を教えてください' },
  { pattern: /週\d|曜日/, index: 3, question: '募集要項にある稼働日数・曜日に対応できますか?' },
  { pattern: /単価|報酬|時給|月額|円/, index: 4, question: '募集要項に記載の金額感について、希望とのすり合わせをさせてください' },
  { pattern: /急募|即日|すぐ/, index: 3, question: '開始時期はいつから対応可能ですか?' },
  { pattern: /長期|継続/, index: 1, question: '長期的な参画を想定していますが、継続的に稼働できそうですか?' },

  { pattern: /HTML|CSS|コーディング|Shopify|Wordpress|WordPress|LP制作|サイト制作/, index: 2, question: 'コーディングやサイト制作の実績を、使用言語・CMSと合わせて教えてください' },
  { pattern: /デザイン|Figma|UI|UX|バナー/, index: 2, question: '過去に手がけたデザインの実績を見せていただくことは可能ですか?' },
  { pattern: /マーケティング|広告運用|SNS運用|集客/, index: 2, question: '施策の効果を数値(CVR・CPAなど)で教えてください' },
  { pattern: /経理|記帳|請求書|会計/, index: 2, question: '利用したことのある会計ソフトや経理業務の範囲を教えてください' },
  { pattern: /ライティング|記事作成|SEO|執筆/, index: 2, question: 'SEOを意識した記事作成の実績や得意ジャンルを教えてください' },
  { pattern: /動画編集|Premiere|After Effects|撮影/, index: 2, question: '使用している編集ソフトと、得意な動画のジャンルを教えてください' },
  { pattern: /エンジニア|開発|プログラミング|React|Python|Java/, index: 2, question: '使用言語・フレームワークと、開発経験年数を教えてください' },
  { pattern: /事務|アシスタント|秘書/, index: 2, question: 'これまで担当した事務業務の範囲(対応ツール含む)を教えてください' }
];

function generateHeuristic(jobContent) {
  var categories = buildHeuristicCategories(jobContent);
  KEYWORD_QUESTIONS.forEach(function(kq) {
    if (kq.pattern.test(jobContent) && categories[kq.index].questions.indexOf(kq.question) === -1) {
      categories[kq.index].questions.push(kq.question);
    }
  });
  return categories;
}

function generateProposalHeuristic(jobContent, profile) {
  var jobExcerpt = excerpt(jobContent);
  var profileText = (profile || '').trim();
  var achievementsBlock = profileText || '[ここにご自身の実績・スキルを記入してください]';

  return [
    '拝啓',
    '',
    'この度は貴社の募集をご覧になり、ご連絡いたしました。',
    '',
    '募集内容を拝見し、「' + jobExcerpt + '」という点にお困りかと存じます。',
    '',
    '私にはこれまで、以下のような実績・経験がございます。',
    achievementsBlock,
    '',
    'つきましては、以下のような進め方で貴社の課題解決に貢献できればと考えております。',
    '1. まずは現状のヒアリングと要件の整理を行います',
    '2. 整理した要件をもとに、具体的な進め方・スケジュールをご提案します',
    '3. 実施しながら適宜認識合わせを行い、認識のズレを防ぎます',
    '',
    'これにより、業務の効率化や成果の向上に貢献できるものと考えております。',
    '',
    'ご不明点やご要望がございましたら、お気軽にお申し付けください。ご検討のほど、何卒よろしくお願いいたします。',
    '',
    '敬具'
  ].join('\n');
}

function renderResult(categories, proposal, sourceNote) {
  var output = document.getElementById('output');
  output.innerHTML = '';

  if (sourceNote) {
    output.appendChild(el('p', { class: 'source-note' }, [sourceNote]));
  }

  var questionSection = el('div', { class: 'section' }, [
    el('p', { class: 'section-title' }, ['① 想定される質問']),
  ]);
  categories.forEach(function(c, i) {
    var num = String(i + 1).padStart(2, '0');
    var qList = el('ul', { class: 'questions' }, (c.questions || []).map(function(q) { return el('li', {}, [q]); }));
    var tipList = el('ul', { class: 'tips' }, (c.tips || []).map(function(t) { return el('li', {}, [t]); }));

    var card = el('div', { class: 'category' }, [
      el('span', { class: 'index' }, [num]),
      el('h3', {}, [c.title]),
      el('h4', {}, ['想定される質問']),
      qList,
      el('h4', {}, ['準備しておくとよいこと']),
      tipList
    ]);
    questionSection.appendChild(card);
  });
  output.appendChild(questionSection);

  var copyBtn = el('button', { class: 'copy-btn' }, ['提案文をコピー']);
  copyBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(proposal).then(function() {
      copyBtn.textContent = 'コピーしました';
      setTimeout(function() { copyBtn.textContent = '提案文をコピー'; }, 2000);
    });
  });

  var proposalSection = el('div', { class: 'section' }, [
    el('p', { class: 'section-title' }, ['② 案件提案文(下書き)']),
    el('div', { class: 'proposal-text' }, [proposal]),
    copyBtn
  ]);
  output.appendChild(proposalSection);

  output.style.display = 'block';
  requestAnimationFrame(function() { output.classList.add('show'); });
  output.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function generateWithAI(jobContent, profile) {
  var res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ input: jobContent, profile: profile })
  });
  var data = await res.json();
  if (!res.ok) throw new Error(data.error || 'AI解析に失敗しました');
  return data;
}

document.getElementById('submit-btn').addEventListener('click', async function() {
  var jobContent = document.getElementById('job-content').value.trim();
  var profile = document.getElementById('profile').value.trim();
  var errorEl = document.getElementById('form-error');
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('submit-btn');

  if (!jobContent) {
    errorEl.textContent = '案件内容またはURLを入力してください';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  if (WORKER_URL) {
    btn.disabled = true;
    statusEl.textContent = /^https?:\/\//i.test(jobContent) ? 'URLを読み込んで解析しています…' : '案件内容を解析しています…';
    statusEl.style.display = 'block';
    try {
      var data = await generateWithAI(jobContent, profile);
      renderResult(data.categories, data.proposal, null);
    } catch (e) {
      statusEl.textContent = 'AI解析に失敗したため、簡易版を表示します(' + e.message + ')';
      renderResult(generateHeuristic(jobContent), generateProposalHeuristic(jobContent, profile), null);
      return;
    } finally {
      btn.disabled = false;
    }
    statusEl.style.display = 'none';
  } else {
    var note = /^https?:\/\//i.test(jobContent)
      ? 'AIバックエンド未接続のため、URLの中身は読み込まず簡易版で表示しています。募集要項の本文を貼り付けると、より案件に沿った内容になります。'
      : 'AIバックエンド未接続のため、簡易版(テンプレート)で表示しています。';
    renderResult(generateHeuristic(jobContent), generateProposalHeuristic(jobContent, profile), note);
  }
});
</script>
</body>
</html>
